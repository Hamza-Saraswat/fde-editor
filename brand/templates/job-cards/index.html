<!doctype html>
<!-- TEMPLATE job-cards — two related cards stacked in one side zone; the second enters on a later word.
     Framing: speaker LEFT third → zone "right-wide". Beats (graphic-relative, from spoken words):
     0.00 card A in ("One wants a developer…") · 2.40 card B in ("The other wants…") ·
     3.60 marker on "RAG" · 4.20 marker on "agents" · exit ends at data-duration. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=2560, height=1440" />
  <link rel="stylesheet" href="kit/tokens.css" />
  <link rel="stylesheet" href="kit/components.css" />
  <script src="kit/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="2560" data-height="1440">
    <div id="zone" class="clip fn-zone" data-zone="right-wide" data-start="0" data-duration="8" data-track-index="1">
      <div class="fn-card tight" id="cardA">
        <div style="display:flex;justify-content:space-between;align-items:center;"><span class="fn-chip">Card A</span><span class="fn-label">AI Engineer</span></div>
        <div class="fn-h1" style="margin-top:20px;">AI-powered developer</div>
        <div class="fn-mono" style="margin-top:14px;">Copilot · Claude · Node.js</div>
      </div>
      <div class="fn-card tight signal" id="cardB">
        <div style="display:flex;justify-content:space-between;align-items:center;"><span class="fn-chip">Card B</span><span class="fn-label">AI Engineer</span></div>
        <div class="fn-h1" style="margin-top:20px;">Applied AI engineer</div>
        <div class="fn-mono" style="margin-top:14px;"><span class="fn-mark" id="m1">RAG</span> · <span class="fn-mark" id="m2">agents</span> · cross-functional</div>
      </div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const D = 8;
    const tl = gsap.timeline({ paused: true });
    const enter = (sel, at) => tl.fromTo(sel, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at);
    enter("#cardA", 0);
    enter("#cardB", 2.4);
    tl.fromTo("#m1", { "--fn-mark": "0%" }, { "--fn-mark": "100%", duration: 0.35, ease: "power2.out" }, 3.6)
      .fromTo("#m2", { "--fn-mark": "0%" }, { "--fn-mark": "100%", duration: 0.35, ease: "power2.out" }, 4.2)
      .to(["#cardA", "#cardB"], { opacity: 0, x: 40, duration: 0.35, stagger: 0.05, ease: "power2.in" }, D - 0.4);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
