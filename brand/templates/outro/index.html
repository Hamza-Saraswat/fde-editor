<!doctype html>
<!-- OUTRO end card — full frame, opaque, 12 s. Rendered per video with --variables '{"nextTitle":"…"}'.
     The right half is deliberately empty: YouTube's end-screen elements (next video + subscribe) are placed
     there in YouTube Studio. YouTube allows end screens in the last 5–20 s, so keep this ≥ 10 s. -->
<html lang="en" data-composition-variables='[
  {"id":"nextTitle","type":"string","label":"Next video title","default":"Next video: coming soon"},
  {"id":"cta","type":"string","label":"Call to action","default":"New video every week. Subscribe to catch the next one."}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=2560, height=1440" />
  <link rel="stylesheet" href="kit/tokens.css" />
  <link rel="stylesheet" href="kit/components.css" />
  <script src="kit/gsap.min.js"></script>
  <style>
    #bg { position: absolute; inset: 0; background: var(--fn-ink); }
    #panel { position: absolute; left: 160px; top: 50%; transform: translateY(-50%); width: 1060px; }
    #next { font-size: 84px; }
    #cta { margin-top: 26px; color: var(--fn-muted); }
    #slots { position: absolute; right: 160px; top: 50%; transform: translateY(-50%); width: 1100px; height: 720px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="2560" data-height="1440">
    <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
    <div id="panel" class="clip" data-start="0" data-duration="12" data-track-index="1">
      <div class="fn-card" id="card">
        <div class="fn-label signal">Next up</div>
        <div id="next" class="fn-h1" style="margin-top:18px;" data-var-text="nextTitle">Next video: coming soon</div>
        <div id="cta" class="fn-body" data-var-text="cta">New video every week. Subscribe to catch the next one.</div>
        <div class="fn-label" style="margin-top:34px;">Hamza Saraswat · hamza-saraswat.com</div>
      </div>
    </div>
    <div id="slots" class="clip" data-start="0" data-duration="12" data-track-index="2"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#card", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2)
      .fromTo("#card > *", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.1, ease: "power2.out" }, 0.35)
      .to("#card", { opacity: 0, duration: 0.4, ease: "power2.in" }, 11.6);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
