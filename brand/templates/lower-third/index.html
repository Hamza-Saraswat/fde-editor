<!doctype html>
<!-- TEMPLATE lower-third — name + role under the speaker. Speaker LEFT third → zone "lower-third-left"
     (RIGHT third → "lower-third-right"; centred → "lower-third-left"). 5 s, enters from below. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=2560, height=1440" />
  <link rel="stylesheet" href="kit/tokens.css" />
  <link rel="stylesheet" href="kit/components.css" />
  <script src="kit/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="2560" data-height="1440">
    <div id="zone" class="clip fn-zone" data-zone="lower-third-left" data-start="0" data-duration="5" data-track-index="1">
      <div class="fn-card fn-lower-third" id="lt">
        <div class="name">Hamza Saraswat</div>
        <div class="fn-label signal role">AI Engineer · builds production AI</div>
      </div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const D = 5;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#lt", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0)
      .fromTo("#lt .role", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3)
      .to("#lt", { opacity: 0, y: 20, duration: 0.35, ease: "power2.in" }, D - 0.35);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
